version: '3.8'

services:
  suno-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SUNO_COOKIE: ${SUNO_COOKIE}
    image: suno-api:latest
    container_name: suno-api-prod
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    environment:
      - NODE_ENV=production
      - SUNO_COOKIE=${SUNO_COOKIE}
      - TWOCAPTCHA_KEY=${TWOCAPTCHA_KEY}
      - BROWSER=${BROWSER:-chromium}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - BROWSER_LOCALE=${BROWSER_LOCALE:-en}
      - BROWSER_GHOST_CURSOR=${BROWSER_GHOST_CURSOR:-false}
      - BROWSER_DISABLE_GPU=true
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

    volumes:
      - ../../public:/app/public:ro
      - logs:/app/logs

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - suno-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: suno-redis
    restart: unless-stopped

    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

    networks:
      - suno-network

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: suno-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx

    depends_on:
      - suno-api

    networks:
      - suno-network

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  suno-network:
    driver: bridge

volumes:
  logs:
  redis-data:
  nginx-logs:
